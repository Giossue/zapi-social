name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zapi_v2_local
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zapi_v2_local"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zapi_v2_local
      IDENTITY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zapi_v2_local
      PORTAL_AUTOMATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zapi_v2_local
      PORTAL_BACKEND_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zapi_v2_local
      PUBLISHING_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zapi_v2_local
      RSS_SCHEDULES_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zapi_v2_local
      SUPPORT_WATERMARKS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zapi_v2_local
      TEAM_ACCOUNT_ACCESS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zapi_v2_local
      TEAMS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zapi_v2_local
      GOOGLE_DRIVE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zapi_v2_local
      JWT_ACCESS_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      PROVIDER_INTEGRATIONS_ENCRYPTION_KEY: ci-only-provider-encryption-key
      API_PUBLIC_ORIGIN: http://127.0.0.1:3001
      INTERNAL_API_ORIGIN: http://127.0.0.1:3001
      WEB_ORIGIN: http://127.0.0.1:3000
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check dependency advisories
        run: bun audit

      - name: Apply database migrations
        run: bun run --filter @workspace/database db:migrate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Run repository audits
        run: |
          python3 scripts/audit_portal_admin_ui.py --fail-on-findings
          bun run audit:i18n
          bun run audit:i18n-hardcoded
          bun run audit:schema

      - name: Test API
        run: bun run --filter api test --runInBand

      - name: Test worker
        run: bun run --filter worker test --runInBand
