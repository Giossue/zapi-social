# Ejecutar junto a compose.yaml y un --env-file local/de despliegue. El mismo
# volumen y el mismo destino son obligatorios para que API y Worker vean tanto
# originales como derivados.
services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile.api
    environment:
      FILES_STORAGE_PATH: ${FILES_STORAGE_PATH:-/app/.data/files}
    volumes:
      - files-data:${FILES_STORAGE_PATH:-/app/.data/files}

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    environment:
      FILES_STORAGE_PATH: ${FILES_STORAGE_PATH:-/app/.data/files}
    volumes:
      - files-data:${FILES_STORAGE_PATH:-/app/.data/files}

volumes:
  files-data:
